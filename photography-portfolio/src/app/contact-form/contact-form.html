<form class="formulario" #formulario="ngForm" (ngSubmit)="enviar(formulario)" novalidate>
  <div class="formulario__campo">
    <label for="nombre">Nombre</label>
    <input id="nombre" name="nombre" type="text" ngModel required placeholder="Tu nombre" />
  </div>

  <div class="formulario__campo">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" ngModel required email placeholder="tu@email.com" />
  </div>

  <div class="formulario__campo">
    <label for="mensaje">Mensaje</label>
    <textarea
      id="mensaje"
      name="mensaje"
      rows="4"
      ngModel
      required
      placeholder="Cuéntame qué sesión tienes en mente..."
    ></textarea>
  </div>

  <button class="formulario__boton" type="submit" [disabled]="formulario.invalid">Enviar mensaje</button>

  @if (enviado()) {
    <p class="formulario__ok">¡Gracias! Te responderé lo antes posible.</p>
  }
</form>
