jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photography-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: photography-portfolio/package-lock.json
      - run: npm ci
      - run: node scripts/sync-drive.mjs
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      - name: Commit y push
        run: |
          git config user.name "drive-sync[bot]"
          git config user.email "drive-sync@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet || (git commit -m "chore: sync galería desde Drive" && git push)